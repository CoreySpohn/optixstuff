[build-system]
requires = ['hatchling>=1.26.3', "hatch-fancy-pypi-readme>=24.1.0", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "optixstuff"
description = "Hardware abstractions for the HWO direct imaging simulation suite"
authors = [{ name = "Corey Spohn", email = "corey.a.spohn@nasa.gov" }]
dynamic = ['readme', 'version']
requires-python = ">=3.12"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "equinox>=0.13.2",
    "hwoutils>=1.10.0",
    "interpax>=0.3.12",
    "jax>=0.8.1",
    "jaxlib>=0.8.1",
    "jaxtyping>=0.3.3",
    "yippy>=2.10.6",
]

[project.optional-dependencies]
dev = ["pre-commit>=3.5"]
docs = [
    "sphinx>=7.2",
    "myst-nb>=1.0",
    "sphinx-book-theme>=1.1",
    "sphinx-autoapi>=3.0",
    "sphinxcontrib-mermaid>=0.9",
    "ipython>=8.18",
    "matplotlib>=3.10.7",
]
test = [
    "pytest>=7.3.2",
    "hypothesis>=6.79.1",
    "pytest-cov>=1.0",
    "pytest-xdist>=2.5",
    "pytest-testmon>=2.0.7",
    "pytest-markdown-docs>=0.5.0",
    "pytest-timeout>=1.3.1",
    "pytest-fail-slow>=0.1.0",
    # The optional hwoutils budget plugin uses psutil for portable RSS sampling.
    "psutil>=5.9.4",
    "numpy>=2.0",
]

[project.urls]
Homepage = "https://github.com/CoreySpohn/optixstuff"
Issues = "https://github.com/CoreySpohn/optixstuff/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/optixstuff/_version.py"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "UP", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.hatch.build.targets.wheel]
packages = ["src/optixstuff"]

[tool.hatch.build.targets.sdist]
exclude = ["/scripts", "/docs", "/tests", "/.github"]

[tool.pytest.ini_options]
filterwarnings = ["error"]
markers = [
    "medium: tests with a 30-second default time budget",
    "slow: tests with a 300-second default time budget, run nightly",
]

[tool.testbudget]
library = "optixstuff"
mode = "report"
unit_s = 5
medium_s = 30
slow_s = 300

[tool.deptry]
known_first_party = ["optixstuff"]
optional_dependencies_dev_groups = ["dev", "docs", "test"]

[tool.deptry.per_rule_ignores]
# JAX loads its compiled backend; keep the explicit minimum version constraint.
DEP002 = ["jaxlib"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src/optixstuff"]
